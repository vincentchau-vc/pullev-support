<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>PullEV Host</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222d;
      --text: #f2f4f7;
      --muted: #9aa4b2;
      --gold: #e8c36a;
      --link: #6cb6ff;
      --ok: #5ee39a;
      --line: rgba(255,255,255,0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      color: var(--text); line-height: 1.45;
      background:
        radial-gradient(1200px 600px at 20% -10%, #243044 0%, transparent 55%),
        radial-gradient(900px 480px at 100% 0%, rgba(232,195,106,0.1) 0%, transparent 50%),
        var(--bg);
    }
    .wrap { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    .brand { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 0.35rem; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
    .topbar h1 { font-size: 1.4rem; margin: 0 0 0.2rem; font-weight: 800; color: var(--gold); }
    .topbar .sub { color: var(--muted); margin: 0; font-size: 0.85rem; }
    .lang-select {
      appearance: none; -webkit-appearance: none;
      border: 1px solid var(--line); border-radius: 10px;
      background: color-mix(in srgb, var(--card) 92%, white 4%);
      color: var(--text); font-size: 0.72rem; font-weight: 700;
      padding: 0.35rem 1.6rem 0.35rem 0.55rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 12px) calc(50% - 2px), calc(100% - 7px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      cursor: pointer; max-width: 7.5rem; flex-shrink: 0;
    }
    .section { margin-top: 1.15rem; }
    .section-title {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gold); margin: 0 0 0.55rem;
    }
    .pool-list { display: flex; flex-direction: column; gap: 0.55rem; }
    .pool-card {
      display: block; text-decoration: none; color: inherit;
      padding: 0.85rem 0.95rem;
      background: color-mix(in srgb, var(--card) 92%, white 4%);
      border: 1px solid var(--line); border-radius: var(--radius);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .pool-card:hover { border-color: rgba(232,195,106,0.35); transform: translateY(-1px); }
    .pool-card .title { font-weight: 800; font-size: 0.95rem; margin: 0 0 0.35rem; }
    .pool-card .meta {
      display: flex; flex-wrap: wrap; gap: 0.35rem 0.65rem;
      font-size: 0.72rem; color: var(--muted);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.12rem 0.45rem; border-radius: 999px;
      border: 1px solid var(--line); font-weight: 700; font-size: 0.65rem;
    }
    .pill.live { color: var(--ok); border-color: rgba(94,227,154,0.35); }
    .pill.done { color: var(--muted); }
    .pill.blind { color: var(--link); border-color: rgba(108,182,255,0.28); }
    .empty { color: var(--muted); font-size: 0.82rem; padding: 0.35rem 0; }
    .error-msg { color: #ff7b72; font-size: 0.78rem; margin-top: 0.5rem; }
    .site-foot { margin-top: 1.5rem; text-align: center; font-size: 0.65rem; color: var(--muted); }
    .site-foot a { color: var(--link); text-decoration: none; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
  <link rel="stylesheet" href="/assets/store-badges.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <p class="brand">PullEV</p>
        <h1 id="title">—</h1>
        <p class="sub" id="subtitle" data-i18n="loading">載入中…</p>
      </div>
      <div>
        <label class="visually-hidden" for="langSelect" data-i18n="language">語言</label>
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="zh-Hant">繁體中文</option>
          <option value="zh-Hans">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>

    <section class="section" id="activeSection" hidden>
      <h2 class="section-title" data-i18n="activePools">進行中</h2>
      <div class="pool-list" id="activeList"></div>
    </section>

    <section class="section" id="completedSection" hidden>
      <h2 class="section-title" data-i18n="completedPools">已完結</h2>
      <div class="pool-list" id="completedList"></div>
    </section>

    <p class="empty" id="emptyHint" hidden></p>
    <p class="error-msg" id="errorMsg" hidden></p>

    <footer class="site-foot">
      <div class="store-badges">
        <a class="store-badge" href="https://apps.apple.com/app/id6791817935" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store">
          <img src="/assets/badge-app-store.svg" width="120" height="40" alt="Download on the App Store" />
        </a>
        <span class="store-badge store-badge--soon" aria-label="Google Play — Coming soon">
          <img src="/assets/badge-google-play.svg" width="135" height="40" alt="Get it on Google Play" />
          <span class="store-soon" data-i18n="comingSoon">即將推出</span>
        </span>
      </div>
      <a href="/">PullEV</a>
    </footer>
  </div>
  <script>
    (function () {
      const LOCALES = ['zh-Hant', 'zh-Hans', 'en', 'ja'];
      const LANG_KEY = 'pullevLiveLang';
      const STRINGS = {
        'zh-Hant': {
          pageTitle: 'PullEV Host',
          language: '語言',
          loading: '載入中…',
          missingSlug: '缺少開池者 ID（/h/<slug>）',
          notFound: '找不到此個人頁，或已關閉。',
          activePools: '進行中',
          completedPools: '已完結',
          emptyPools: '暫時未有可顯示嘅池。',
          untitled: '未命名池',
          remaining: '剩餘 %d',
          drawn: '已抽 %d',
          price: '每抽 HK$%s',
          live: '進行中',
          done: '已完結',
          blind: '暗池',
          open: '明池',
          viewDetail: '睇詳情',
          comingSoon: '即將推出',
        },
        'zh-Hans': {
          pageTitle: 'PullEV Host',
          language: '语言',
          loading: '加载中…',
          missingSlug: '缺少开池者 ID（/h/<slug>）',
          notFound: '找不到此个人页，或已关闭。',
          activePools: '进行中',
          completedPools: '已完结',
          emptyPools: '暂时没有可显示的池。',
          untitled: '未命名池',
          remaining: '剩余 %d',
          drawn: '已抽 %d',
          price: '每抽 HK$%s',
          live: '进行中',
          done: '已完结',
          blind: '暗池',
          open: '明池',
          viewDetail: '看详情',
          comingSoon: '即将推出',
        },
        en: {
          pageTitle: 'PullEV Host',
          language: 'Language',
          loading: 'Loading…',
          missingSlug: 'Missing host ID (/h/<slug>)',
          notFound: 'This page was not found or is private.',
          activePools: 'Live',
          completedPools: 'Finished',
          emptyPools: 'No pools to show yet.',
          untitled: 'Untitled pool',
          remaining: '%d left',
          drawn: '%d drawn',
          price: 'HK$%s / pull',
          live: 'Live',
          done: 'Done',
          blind: 'Blind',
          open: 'Open',
          viewDetail: 'Details',
          comingSoon: 'Coming soon',
        },
        ja: {
          pageTitle: 'PullEV Host',
          language: '言語',
          loading: '読み込み中…',
          missingSlug: 'ホスト ID がありません（/h/<slug>）',
          notFound: 'ページが見つからないか非公開です。',
          activePools: '進行中',
          completedPools: '終了',
          emptyPools: '表示できるプールはまだありません。',
          untitled: '無題のプール',
          remaining: '残り %d',
          drawn: '抽選済 %d',
          price: 'HK$%s / 回',
          live: '進行中',
          done: '終了',
          blind: '闇箱',
          open: '公開',
          viewDetail: '詳細',
          comingSoon: '近日公開',
        },
      };

      function mapTagToLocale(tag) {
        if (!tag || typeof tag !== 'string') return null;
        const raw = tag.trim();
        if (!raw) return null;
        if (LOCALES.includes(raw)) return raw;
        const t = raw.replace(/_/g, '-').toLowerCase();
        if (t === 'zh-hant') return 'zh-Hant';
        if (t === 'zh-hans') return 'zh-Hans';
        if (t === 'en' || t.startsWith('en-')) return 'en';
        if (t === 'ja' || t.startsWith('ja-')) return 'ja';
        if (t.startsWith('zh')) {
          if (
            t.includes('hant') || t.includes('-hk') || t.includes('-tw') || t.includes('-mo') ||
            t.endsWith('hk') || t.endsWith('tw') || t.endsWith('mo')
          ) return 'zh-Hant';
          if (
            t.includes('hans') || t.includes('-cn') || t.includes('-sg') ||
            t.endsWith('cn') || t.endsWith('sg')
          ) return 'zh-Hans';
          return 'zh-Hant';
        }
        return null;
      }

      function detectLocale() {
        const params = new URLSearchParams(location.search);
        const fromUrl = mapTagToLocale(params.get('lang'));
        if (fromUrl) return fromUrl;
        const fromStore = mapTagToLocale(localStorage.getItem(LANG_KEY));
        if (fromStore) return fromStore;
        const candidates = [];
        if (Array.isArray(navigator.languages)) candidates.push(...navigator.languages);
        if (navigator.language) candidates.push(navigator.language);
        for (const tag of candidates) {
          const mapped = mapTagToLocale(tag);
          if (mapped) return mapped;
        }
        return 'zh-Hant';
      }

      function setLocaleInUrl(locale) {
        const url = new URL(location.href);
        url.searchParams.set('lang', locale);
        history.replaceState(null, '', url);
      }

      let locale = detectLocale();
      let I18N = STRINGS[locale];
      let lastData = null;

      const parts = location.pathname.split('/').filter(Boolean);
      const slug = parts[0] === 'h' ? parts[1] : null;
      const params = new URLSearchParams(location.search);
      const API = (params.get('api') || localStorage.getItem('pullevHostApi') || 'https://pullev.vcii.live').replace(/\/$/, '');

      localStorage.setItem(LANG_KEY, locale);
      setLocaleInUrl(locale);

      const langSelect = document.getElementById('langSelect');
      const errorMsg = document.getElementById('errorMsg');
      const emptyHint = document.getElementById('emptyHint');

      function applyStaticI18n() {
        document.documentElement.lang = locale;
        document.title = lastData?.displayName
          ? `${lastData.displayName} · PullEV`
          : I18N.pageTitle;
        langSelect.value = locale;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (I18N[key]) el.textContent = I18N[key];
        });
        if (!slug) {
          document.getElementById('subtitle').textContent = I18N.missingSlug;
        } else if (!lastData) {
          document.getElementById('subtitle').textContent = I18N.loading;
        } else {
          document.getElementById('subtitle').textContent = '/' + slug;
        }
      }

      function switchLocale(next) {
        const mapped = mapTagToLocale(next);
        if (!mapped || mapped === locale) return;
        locale = mapped;
        I18N = STRINGS[locale];
        localStorage.setItem(LANG_KEY, locale);
        setLocaleInUrl(locale);
        applyStaticI18n();
        if (lastData) render(lastData);
      }

      langSelect.addEventListener('change', () => switchLocale(langSelect.value));
      applyStaticI18n();

      if (!slug) {
        return;
      }

      function money(n) {
        if (n == null || Number.isNaN(n)) return '—';
        return Math.round(n).toLocaleString(locale);
      }

      function poolCard(pool, isActive) {
        const a = document.createElement('a');
        a.className = 'pool-card';
        a.href = `/live/${encodeURIComponent(pool.id)}?lang=${encodeURIComponent(locale)}`;

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = pool.title || I18N.untitled;
        a.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'meta';

        const status = document.createElement('span');
        status.className = 'pill ' + (isActive ? 'live' : 'done');
        status.textContent = isActive ? I18N.live : I18N.done;
        meta.appendChild(status);

        const vis = document.createElement('span');
        vis.className = 'pill' + (pool.visibility === 'blind' ? ' blind' : '');
        vis.textContent = pool.visibility === 'blind' ? I18N.blind : I18N.open;
        meta.appendChild(vis);

        if (isActive && pool.remainingCount != null) {
          const rem = document.createElement('span');
          rem.textContent = I18N.remaining.replace('%d', pool.remainingCount);
          meta.appendChild(rem);
        } else if (!isActive && pool.drawnCount != null) {
          const drawn = document.createElement('span');
          drawn.textContent = I18N.drawn.replace('%d', pool.drawnCount);
          meta.appendChild(drawn);
        }

        const price = document.createElement('span');
        price.textContent = I18N.price.replace('%s', money(pool.pricePerPullHkd));
        meta.appendChild(price);

        a.appendChild(meta);
        return a;
      }

      function renderList(el, pools, isActive) {
        el.innerHTML = '';
        pools.forEach((p) => el.appendChild(poolCard(p, isActive)));
      }

      function render(data) {
        lastData = data;
        errorMsg.hidden = true;
        document.getElementById('title').textContent = data.displayName || '—';
        document.getElementById('subtitle').textContent = '/' + slug;
        document.title = `${data.displayName || 'Host'} · PullEV`;

        const active = data.activePools || [];
        const completed = data.completedPools || [];

        const activeSection = document.getElementById('activeSection');
        const completedSection = document.getElementById('completedSection');
        activeSection.hidden = active.length === 0;
        completedSection.hidden = completed.length === 0;
        renderList(document.getElementById('activeList'), active, true);
        renderList(document.getElementById('completedList'), completed, false);

        emptyHint.hidden = active.length + completed.length > 0;
        emptyHint.textContent = I18N.emptyPools;
      }

      async function load() {
        errorMsg.hidden = true;
        try {
          const res = await fetch(API + '/v1/public/hosts/' + encodeURIComponent(slug));
          if (res.status === 404) throw new Error(I18N.notFound);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          render(await res.json());
        } catch (err) {
          errorMsg.hidden = false;
          errorMsg.textContent = err.message || I18N.notFound;
          document.getElementById('subtitle').textContent = '';
        }
      }

      load();
    })();
  </script>
</body>
</html>
