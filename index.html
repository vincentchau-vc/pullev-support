<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>PullEV Support</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222d;
      --text: #f2f4f7;
      --muted: #9aa4b2;
      --gold: #e8c36a;
      --link: #6cb6ff;
      --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #243044 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(232,195,106,0.08) 0%, transparent 50%),
        var(--bg);
      color: var(--text); line-height: 1.6;
    }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .brand { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 0.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; color: var(--gold); font-weight: 800; }
    h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--text); }
    p { margin: 0.5rem 0; color: var(--muted); font-size: 0.92rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: color-mix(in srgb, var(--card) 92%, white 4%);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 1rem 1.1rem; margin-top: 1rem;
    }
    .links { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
    .links a {
      display: block; padding: 0.65rem 0.85rem; border-radius: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      font-weight: 600; font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">PullEV</p>
    <h1>技術支援</h1>
    <p>PullEV 係日版 PTCG 盲抽期望值（EV）計算機。</p>
    <div class="card">
      <h2 style="margin-top:0">聯絡我們</h2>
      <p>如需協助，請電郵：<a href="mailto:ptcgpullev@gmail.com">ptcgpullev@gmail.com</a></p>
      <h2>常見問題</h2>
      <p><strong style="color:var(--text)">市價點嚟？</strong> 參考 SNKRDUNK 等公開成交／掛牌資料，匯率為約數，僅供參考。</p>
      <p><strong style="color:var(--text)">點樣去除廣告？</strong> 設定 → 去除廣告（一次性買斷）。</p>
      <p><strong style="color:var(--text)">現場池觀眾頁</strong> 開池後分享 <code>/live/&lt;poolId&gt;</code> 連結即可。</p>
      <div class="links">
        <a href="p/">分享池預覽 /p/</a>
        <a href="live/">現場池範例 /live/</a>
      </div>
    </div>
  </main>
</body>
</html>
