<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>PullEV Support</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222d;
      --text: #f2f4f7;
      --muted: #9aa4b2;
      --gold: #e8c36a;
      --link: #6cb6ff;
      --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, #243044 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(232,195,106,0.08) 0%, transparent 50%),
        var(--bg);
      color: var(--text); line-height: 1.6;
    }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.25rem; }
    .brand { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 0.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; color: var(--gold); font-weight: 800; }
    h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--text); }
    p { margin: 0.5rem 0; color: var(--muted); font-size: 0.92rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: color-mix(in srgb, var(--card) 92%, white 4%);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 1rem 1.1rem; margin-top: 1rem;
    }
    .store-section { margin-top: 1.25rem; text-align: center; }
    .store-section h2 { margin-bottom: 0.65rem; }
    .lang-select {
      appearance: none; -webkit-appearance: none;
      border: 1px solid var(--line); border-radius: 10px;
      background: color-mix(in srgb, var(--card) 92%, white 4%);
      color: var(--text); font-size: 0.72rem; font-weight: 700;
      padding: 0.35rem 1.6rem 0.35rem 0.55rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 12px) calc(50% - 2px), calc(100% - 7px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      cursor: pointer; max-width: 7.5rem; flex-shrink: 0;
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
  <link rel="stylesheet" href="/assets/store-badges.css" />
</head>
<body>
  <main>
    <div class="topbar">
      <p class="brand">PullEV</p>
      <label class="visually-hidden" for="langSelect" data-i18n="language">語言</label>
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>
    <h1 data-i18n="heading">技術支援</h1>
    <p data-i18n="intro">PullEV 係日版 PTCG 盲抽期望值（EV）計算機。</p>
    <div class="card">
      <h2 style="margin-top:0" data-i18n="contactTitle">聯絡我們</h2>
      <p><span data-i18n="contactBody">如需協助，請電郵：</span> <a href="mailto:ptcgpullev@gmail.com">ptcgpullev@gmail.com</a></p>
      <h2 data-i18n="faqTitle">常見問題</h2>
      <p><strong style="color:var(--text)" data-i18n="faqPriceQ">市價點嚟？</strong> <span data-i18n="faqPriceA">參考 SNKRDUNK 等公開成交／掛牌資料，匯率為約數，僅供參考。</span></p>
      <p><strong style="color:var(--text)" data-i18n="faqAdsQ">點樣去除廣告？</strong> <span data-i18n="faqAdsA">設定 → 去除廣告（一次性買斷）。</span></p>
    </div>
    <section class="store-section" aria-label="Download PullEV">
      <h2 data-i18n="downloadApp">下載 App</h2>
      <div class="store-badges">
        <a class="store-badge" href="https://apps.apple.com/app/id6791817935" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store">
          <img src="/assets/badge-app-store.svg" width="120" height="40" alt="Download on the App Store" />
        </a>
        <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.vincentchau.pullev" target="_blank" rel="noopener noreferrer" aria-label="Get it on Google Play">
          <img src="/assets/badge-google-play.svg" width="135" height="40" alt="Get it on Google Play" />
        </a>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const LOCALES = ['zh-Hant', 'zh-Hans', 'en', 'ja'];
      // Shared with /live/ so language preference carries across pages.
      const LANG_KEY = 'pullevLiveLang';
      const STRINGS = {
        'zh-Hant': {
          pageTitle: 'PullEV Support',
          language: '語言',
          heading: '技術支援',
          intro: 'PullEV 係日版 PTCG 盲抽期望值（EV）計算機。',
          contactTitle: '聯絡我們',
          contactBody: '如需協助，請電郵：',
          faqTitle: '常見問題',
          faqPriceQ: '市價點嚟？',
          faqPriceA: '參考 SNKRDUNK 等公開成交／掛牌資料，匯率為約數，僅供參考。',
          faqAdsQ: '點樣去除廣告？',
          faqAdsA: '設定 → 去除廣告（一次性買斷）。',
          downloadApp: '下載 App',
        },
        'zh-Hans': {
          pageTitle: 'PullEV Support',
          language: '语言',
          heading: '技术支持',
          intro: 'PullEV 是日版 PTCG 盲抽期望值（EV）计算器。',
          contactTitle: '联系我们',
          contactBody: '如需协助，请电邮：',
          faqTitle: '常见问题',
          faqPriceQ: '市价从哪来？',
          faqPriceA: '参考 SNKRDUNK 等公开成交／挂牌资料，汇率为约数，仅供参考。',
          faqAdsQ: '如何去除广告？',
          faqAdsA: '设置 → 去除广告（一次性买断）。',
          downloadApp: '下载 App',
        },
        en: {
          pageTitle: 'PullEV Support',
          language: 'Language',
          heading: 'Support',
          intro: 'PullEV is an expected-value (EV) calculator for Japanese PTCG blind pulls.',
          contactTitle: 'Contact',
          contactBody: 'Need help? Email:',
          faqTitle: 'FAQ',
          faqPriceQ: 'Where do prices come from?',
          faqPriceA: 'Public SNKRDUNK sales / listings and approximate FX — for reference only.',
          faqAdsQ: 'How do I remove ads?',
          faqAdsA: 'Settings → Remove Ads (one-time purchase).',
          downloadApp: 'Get the app',
        },
        ja: {
          pageTitle: 'PullEV Support',
          language: '言語',
          heading: 'サポート',
          intro: 'PullEV は日版 PTCG ブラインド抽選の期待値（EV）計算機です。',
          contactTitle: 'お問い合わせ',
          contactBody: 'ご不明点はメールで：',
          faqTitle: 'よくある質問',
          faqPriceQ: '価格の出典は？',
          faqPriceA: 'SNKRDUNK などの公開成約／出品と概算レートです。参考値です。',
          faqAdsQ: '広告を消すには？',
          faqAdsA: '設定 → 広告削除（買い切り）。',
          downloadApp: 'アプリを入手',
        },
      };

      function mapTagToLocale(tag) {
        if (!tag || typeof tag !== 'string') return null;
        const raw = tag.trim();
        if (!raw) return null;
        if (LOCALES.includes(raw)) return raw;
        const t = raw.replace(/_/g, '-').toLowerCase();
        if (t === 'zh-hant') return 'zh-Hant';
        if (t === 'zh-hans') return 'zh-Hans';
        if (t === 'en' || t.startsWith('en-')) return 'en';
        if (t === 'ja' || t.startsWith('ja-')) return 'ja';
        if (t.startsWith('zh')) {
          if (
            t.includes('hant') || t.includes('-hk') || t.includes('-tw') || t.includes('-mo') ||
            t.endsWith('hk') || t.endsWith('tw') || t.endsWith('mo')
          ) return 'zh-Hant';
          if (
            t.includes('hans') || t.includes('-cn') || t.includes('-sg') ||
            t.endsWith('cn') || t.endsWith('sg')
          ) return 'zh-Hans';
          return 'zh-Hant';
        }
        return null;
      }

      function detectLocale() {
        const params = new URLSearchParams(location.search);
        const fromUrl = mapTagToLocale(params.get('lang'));
        if (fromUrl) return fromUrl;
        const fromStore = mapTagToLocale(localStorage.getItem(LANG_KEY));
        if (fromStore) return fromStore;
        const candidates = [];
        if (Array.isArray(navigator.languages)) candidates.push(...navigator.languages);
        if (navigator.language) candidates.push(navigator.language);
        for (const tag of candidates) {
          const mapped = mapTagToLocale(tag);
          if (mapped) return mapped;
        }
        return 'zh-Hant';
      }

      function setLocaleInUrl(locale) {
        const url = new URL(location.href);
        url.searchParams.set('lang', locale);
        history.replaceState(null, '', url);
      }

      let locale = detectLocale();
      let I18N = STRINGS[locale];
      const langSelect = document.getElementById('langSelect');

      localStorage.setItem(LANG_KEY, locale);
      setLocaleInUrl(locale);

      function applyStaticI18n() {
        document.documentElement.lang = locale;
        document.title = I18N.pageTitle;
        langSelect.value = locale;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (I18N[key]) el.textContent = I18N[key];
        });
      }

      function switchLocale(next) {
        const mapped = mapTagToLocale(next);
        if (!mapped || mapped === locale) return;
        locale = mapped;
        I18N = STRINGS[locale];
        localStorage.setItem(LANG_KEY, locale);
        setLocaleInUrl(locale);
        applyStaticI18n();
      }

      langSelect.addEventListener('change', () => switchLocale(langSelect.value));
      applyStaticI18n();
    })();
  </script>
</body>
</html>
