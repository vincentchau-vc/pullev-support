<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PullEV Live</title>
  <style>
    :root {
      --bg: #0e1116;
      --card: #171b22;
      --text: #f2f4f7;
      --muted: #9aa3b2;
      --gold: #d4a84b;
      --line: #2a3140;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 168, 75, 0.18), transparent),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 28rem; margin: 0 auto; padding: 1.5rem 1.1rem 3rem; }
    .brand { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin: 0 0 0.35rem; }
    h1 { font-size: 1.55rem; margin: 0 0 0.25rem; font-weight: 650; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.95rem; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.9rem 1rem;
    }
    .stat .label { color: var(--muted); font-size: 0.75rem; }
    .stat .value { font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 0.15rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel h2 { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.75rem; font-weight: 600; }
    ol { margin: 0; padding-left: 1.2rem; }
    li { margin: 0.35rem 0; }
    .meta { color: var(--muted); font-size: 0.8rem; }
    .error { color: #f0a0a0; }
    .ok { color: #8fd4a4; }
    footer { color: var(--muted); font-size: 0.75rem; margin-top: 1.5rem; }
    code { font-size: 0.8em; }
  </style>
</head>
<body>
  <main>
    <p class="brand">PullEV Host</p>
    <h1 id="title">現場池</h1>
    <p class="sub" id="subtitle">載入中…</p>

    <div class="stats">
      <div class="stat">
        <div class="label">剩餘</div>
        <div class="value" id="remaining">—</div>
      </div>
      <div class="stat">
        <div class="label">已抽</div>
        <div class="value" id="drawn">—</div>
      </div>
    </div>

    <div class="panel" id="jackpotPanel" hidden>
      <h2>剩餘大獎數</h2>
      <div class="value" id="jackpots" style="font-size:1.4rem;font-weight:700;">—</div>
    </div>

    <div class="panel">
      <h2>抽獎記錄</h2>
      <ol id="draws"></ol>
      <p class="meta" id="drawsHint"></p>
    </div>

    <p class="meta" id="status"></p>
    <footer>
      每 3 秒更新。API：<code id="apiLabel"></code>
      · 可加 <code>?api=https://vcii.live/pullev</code>
    </footer>
  </main>
  <script>
    (function () {
      const parts = location.pathname.split('/').filter(Boolean);
      // /live/:id
      const poolId = parts[0] === 'live' ? parts[1] : null;
      const params = new URLSearchParams(location.search);
      const API = (params.get('api') || localStorage.getItem('pullevHostApi') || 'https://vcii.live/pullev').replace(/\/$/, '');
      document.getElementById('apiLabel').textContent = API;

      if (!poolId) {
        document.getElementById('subtitle').textContent = '連結缺少池 ID（/live/<poolId>）';
        document.getElementById('subtitle').className = 'sub error';
        return;
      }

      async function tick() {
        try {
          const res = await fetch(API + '/v1/public/pools/' + encodeURIComponent(poolId));
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          render(data);
          document.getElementById('status').textContent = '已更新 · ' + new Date().toLocaleTimeString();
          document.getElementById('status').className = 'meta ok';
        } catch (err) {
          document.getElementById('status').textContent = '無法連線：' + err.message;
          document.getElementById('status').className = 'meta error';
        }
      }

      function render(data) {
        document.getElementById('title').textContent = data.title || '現場池';
        document.getElementById('subtitle').textContent =
          (data.visibility === 'blind' ? '暗池' : '明池') + ' · ' + data.status;
        document.getElementById('remaining').textContent = data.remainingCount;
        document.getElementById('drawn').textContent = data.drawnCount;

        const jp = document.getElementById('jackpotPanel');
        if (typeof data.remainingJackpotCount === 'number') {
          jp.hidden = false;
          document.getElementById('jackpots').textContent = data.remainingJackpotCount;
        } else {
          jp.hidden = true;
        }

        const ol = document.getElementById('draws');
        ol.innerHTML = '';
        const draws = (data.draws || []).slice().reverse();
        if (!draws.length) {
          document.getElementById('drawsHint').textContent = '尚未抽獎';
        } else {
          document.getElementById('drawsHint').textContent = '';
          for (const d of draws) {
            const li = document.createElement('li');
            const when = d.drawnAt ? new Date(d.drawnAt).toLocaleTimeString() : '';
            if (d.prizeName) {
              li.textContent = '#' + d.slotNumber + ' · ' + d.prizeName + (when ? ' · ' + when : '');
            } else {
              li.textContent = '#' + d.slotNumber + '（細節待公開）' + (when ? ' · ' + when : '');
            }
            ol.appendChild(li);
          }
        }
      }

      tick();
      setInterval(tick, 3000);
    })();
  </script>
</body>
</html>
